<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Diagnostic Form</title>

<style>
:root {
    --primary: #0f172a;
    --accent: #2563eb;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --bg-page: #f8fafc;
    --bg-card: #ffffff;
    --border: #cbd5e1;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-page);
    color: var(--text-main);
    padding: 40px 20px;
}
.form-container {
    max-width: 750px;
    background: white;
    margin: auto;
    padding: 40px;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
}
.section-title {
    font-size: 13px;
    text-transform: uppercase;
    color: var(--accent);
    margin: 40px 0 20px;
    font-weight: 700;
}
.field { margin-bottom: 20px; }
label { font-weight: 600; display: block; margin-bottom: 5px; }
input, textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
}
textarea { min-height: 80px; }
button {
    width: 100%;
    padding: 15px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    margin-top: 20px;
    font-size: 16px;
}
</style>
</head>

<body>

<div class="form-container">

<form action="https://formspree.io/f/xpqewvpa" method="POST">

<input type="hidden" name="_subject" value="New Diagnostic Submission">

<!-- CONTACT -->
<div class="section-title">Client Info</div>

<div class="field">
<label>Name</label>
<input type="text" name="Name" required>
</div>

<div class="field">
<label>Phone</label>
<input type="tel" name="Phone" required>
</div>

<div class="field">
<label>Email</label>
<input type="email" name="Email" required>
</div>

<div class="field">
<label>Business Name</label>
<input type="text" name="Business" required>
</div>

<div class="field">
<label>Industry</label>
<input type="text" name="Industry" required>
</div>

<!-- CUSTOMER PROFILES -->
<div class="section-title">Customer Profiles</div>

<div class="field">
    <label>Who are your most common customers?</label>
    <textarea name="Q1" placeholder="Example: “Walk-in mobile users, students, office workers, nearby residents”"></textarea>
</div>
<div class="field">
    <label>Who are your best customers (high value + easy to deal with)?</label>
    <textarea name="Q2" placeholder="Example: “Small business owners with multiple devices or repeat repair needs”"></textarea>
</div>
<div class="field">
    <label>Who are your least profitable or difficult customers?</label>
    <textarea name="Q3" placeholder="Example: “Price negotiators, people who compare 5 shops, one-time low-value repairs”"></textarea>
</div>
<div class="field">
    <label>Why do customers come to your shop?</label>
    <textarea name="Q4" placeholder="Example: “My phone is not working / screen is broken / laptop is slow or dead”"></textarea>
</div>
<div class="field">
    <label>What happens if they don’t fix it?</label>
    <textarea name="Q5" placeholder="Example: “They lose communication, work stops, or they need to buy a new device”"></textarea>
</div>
<div class="field">
    <label>Why do they choose your shop instead of others nearby?</label>
    <textarea name="Q6" placeholder="Example: “Faster repair, trust, better warranty, original parts, honest diagnosis”"></textarea>
</div>

<!-- OPERATIONS -->
<div class="section-title">Operations</div>

<div class="field">
    <label>How do customers get service from you?</label>
    <textarea name="Q7" placeholder="Example: “Walk-in repair, same-day service, WhatsApp updates, pickup/drop-off”"></textarea>
</div>
<div class="field">
    <label>What processes in your business are manual works?</label>
    <textarea name="Q8" placeholder="Example: “Diagnosis, part replacement, testing, customer communication”"></textarea>
</div>
<div class="field">
    <label>What steps could be standardized or faster?</label>
    <textarea name="Q9" placeholder="Example: “Price quoting, job cards, repair tracking, inventory checking”"></textarea>
</div>
<div class="field">
    <label>List all products/services your business sells?</label>
    <textarea name="Q10" placeholder="Example: “Screen repair, battery replacement, motherboard repair, software installation, accessories”"></textarea>
</div>
<div class="field">
    <label>Do customers understand your offerings/services clearly?</label>
    <textarea name="Q11" placeholder="Example: “Yes / somewhat / customers often ask for clarification”"></textarea>
</div>
<div class="field">
    <label>Do you offer bundled products/services?</label>
    <textarea name="Q12" placeholder="Example: “Device + data backup + cleaning + warranty package”"></textarea>
</div>
 
    
<!--
<textarea name="Q7" placeholder="How customers get service?"></textarea>
<textarea name="Q8" placeholder="Manual steps?"></textarea>
<textarea name="Q9" placeholder="What can be faster?"></textarea>
<textarea name="Q10" placeholder="Services offered?"></textarea>
<input name="Q11" placeholder="Do customers understand services?">
<input name="Q12" placeholder="Bundled services?">
-->

<!-- REVENUE -->
<div class="section-title">Revenue</div>

<textarea name="Q13" placeholder="Income sources"></textarea>
<input name="Q14" placeholder="Most daily cash">
<input name="Q15" placeholder="Highest profit">
<input name="Q16" placeholder="Low profit jobs">

<!-- PRICING -->
<div class="section-title">Pricing</div>

<textarea name="Q17" placeholder="Pricing method"></textarea>
<input name="Q18" placeholder="Price or quality">
<input name="Q19" placeholder="Fixed or negotiated">

<!-- RETENTION -->
<div class="section-title">Retention</div>

<input name="Q20" placeholder="Do customers return?">
<input name="Q21" placeholder="Repeat %">
<input name="Q22" placeholder="Maintenance plans?">
<textarea name="Q23" placeholder="How customers find you"></textarea>
<input name="Q24" placeholder="Best source">
<input name="Q25" placeholder="Marketing activity">

<!-- GROWTH -->
<div class="section-title">Growth</div>

<textarea name="Q26" placeholder="Upsells"></textarea>
<input name="Q27" placeholder="Upsell system">
<textarea name="Q28" placeholder="New services"></textarea>
<textarea name="Q29" placeholder="Expenses"></textarea>
<textarea name="Q30" placeholder="Variable costs"></textarea>
<textarea name="Q31" placeholder="Growth limits"></textarea>
<input name="Q32" placeholder="Runs without you?">
<textarea name="Q33" placeholder="Future vision"></textarea>

<button type="submit">Submit</button>

</form>

</div>

</body>
</html>
